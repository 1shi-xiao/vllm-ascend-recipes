tuning: 可执行基线遵循固定 main 版本，不采用有冲突的汇总表：上下文为 40960，TP4 = 4 个逻辑设备，并发序列为 32。源汇总表的设备数不一致，且 38B 表中另列 135000 上下文，均未采用。源请求错误地指向
  8000 端口，本配方改为真实服务端口。当前 main 将 fused MC2 移入 additional-config 并移除旧 FlashComm/async 标志，配方保留当前命令。`/` 本地媒体权限沿用源文档，共享服务应限制此路径。显存估算仅考虑权重，不包含
  KV 缓存、运行时和混合精度视觉开销，实际占用需要实测。
