  benchmark: 尚未测量。使用 [vLLM 基准测试](https://docs.vllm.ai/en/latest/benchmarking/)或 [AISBench 性能评估](https://docs.vllm.ai/projects/ascend/en/v0.23.0/developer_guide/evaluation/using_ais_bench.html#execute-performance-evaluation)，单独保存请求数、成功数、输入输出长度、并发、TTFT、TPOT
    和吞吐量，与就绪证据区分。
