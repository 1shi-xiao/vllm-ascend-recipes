prerequisites:
- title: 验证边界与来源
  content: 本迁移列出的硬件配置均为实验状态，尚未实测启动、推理、精度或性能。可变 nightly 镜像仅作为当前验证候选，不代表兼容性保证；运行前请记录仓库摘要和软件包版本。
- title: 带日期的镜像来源
  content: 2026-10-20 查询镜像仓库：`nightly-main-a3` 清单摘要为 `sha256:c32749b08b289227e1aea7b99caf669cae63deb60d57ecac23d098b3e169d839`；Linux
    arm64 平台清单为 `sha256:e80e4a75f03562853a503546d3d8ea1e96193fa532b5e30c5ba7f0680f73f1c9`，镜像创建于 2026-10-20T00:33:33Z。这仅属于仓库来源证据，未下载镜像层或验证运行时。需要固定候选镜像时，请在启动容器前，将下方
    IMAGE 值改为 `quay.io/ascend/vllm-ascend@sha256:c32749b08b289227e1aea7b99caf669cae63deb60d57ecac23d098b3e169d839`。nightly
    标签会变化，请记录实际拉取的摘要。
- title: 主机准备
  content: 使用具有 16 个可见 64 GB 逻辑设备（8 个双芯片 NPU）的 Atlas 800I A3 节点。按照[安装指南](https://docs.vllm.ai/projects/ascend/en/latest/installation.html)确认驱动、CANN、HCCL
    与容器兼容性。源文档中的 CPU 调频与 sysctl 调优属于可选管理员操作，以下命令不会自动执行。
env_setup:
  container:
    A3:
      content: |-
        在 Linux 昇腾主机上执行，先将权重下载到 `/models`。映射本次部署预留的设备。PD 场景在每个节点执行，各节点必须具有相同的权重相对路径。

        ```bash
        export IMAGE=quay.io/ascend/vllm-ascend:nightly-main-a3
        devices=()
        for i in {0..15}; do devices+=(--device "/dev/davinci$i"); done
        docker run --rm -it --name ascend-recipe --net=host --ipc=host \
          "${devices[@]}" \
          --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc \
          -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /models:/models -w /models "$IMAGE" bash
        ```
scenarios:
- npu: Atlas 800I A3
  precision: W8A8
  deployment: 单节点
  case: TP4
  tags:
  - a3-single
  strategy: single_node_A3
  steps:
  - title: 启动服务
    content: |-
      ```bash
      cd /models
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export TASK_QUEUE_ENABLE=1
      export HCCL_OP_EXPANSION_MODE=AIV
      export OMP_PROC_BIND=false
      export OMP_NUM_THREADS=1
      export VLLM_USE_V1=1
      export VLLM_TORCH_PROFILER_WITH_STACK=0
      export HCCL_BUFFSIZE=1536
      export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3
      vllm serve Eco-Tech/InternVL3_5-38B-w8a8 \
        --port 2002 \
        --served-model-name internvl3_5 \
        --trust-remote-code \
        --max-model-len 40960 \
        --max-num-batched-tokens 16384 \
        --tensor-parallel-size 4 \
        --max-num-seqs 32 \
        --gpu-memory-utilization 0.9 \
        --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,32,64,128,192,256,512]}' \
        --additional-config '{"enable_weight_nz_layout":true,"enable_cpu_binding":true,"enable_fused_mc2":1}'  \
        --mm-processor-cache-gb 0 \
        --enable-chunked-prefill \
        --safetensors-load-strategy prefetch \
        --allowed-local-media-path /
      ```
  - title: 检查就绪并执行推理
    content: |-
      在同一容器的第二个终端中执行。`/v1/models` 仅检查就绪，后续请求必须返回非空响应。

      ```bash
      set -euo pipefail
      curl --fail --silent --show-error http://127.0.0.1:2002/v1/models
      response=$(curl --fail --silent --show-error http://127.0.0.1:2002/v1/chat/completions \
        -H 'Content-Type: application/json' \
        -d '{"model":"internvl3_5","max_tokens":64,"temperature":0,"messages":[{"role":"user","content":[{"type":"image_url","image_url":{"url":"https://modelscope.oss-cn-beijing.aliyuncs.com/resource/tiger.jpeg"}},{"type":"text","text":"What is the text in the illustration?"}]}]}')
      python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["choices"]; m=r["choices"][0]["message"]; assert m.get("content") or m.get("tool_calls")' <<<"$response"
      ```
