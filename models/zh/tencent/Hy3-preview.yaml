features:
  spec_decoding:
    label: MTP
    args:
    - --speculative-config.method
    - mtp
    - --speculative-config.num_speculative_tokens
    - '1'
  expert_parallel:
    label: EP
    args:
    - --enable-expert-parallel
tuning: 官方配置声明上下文为 262144，历史服务基线使用 32768 和 8 个并发序列。MTP 预测 1 个 token，保留 EP 权重过滤及 hy_v3 解析器。BF16 权重显存估算包含单独的 3.8B
  MTP 层：ceil((295+3.8) × 2 × 1.2) = 718 GB，不含 KV 缓存与运行时，也不是实测值。历史教程中的性能数字不属于本次迁移结果。
