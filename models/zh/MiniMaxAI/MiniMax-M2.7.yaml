verification: 单节点请求使用 8000 端口及 `MiniMax-M2.7`。PD 请求使用代理 8009 端口及源别名 `minimax`，不要在代理上复用单节点别名。步骤分别检查就绪和真实推理。单节点启动命令均包含教程可选的
  minimax_m2 解析器，以便测试工具调用。`minimax_m2_append_think` 将思考文本保留在 content；需要单独 reasoning 字段时可改用 minimax_m2。
tuning: 源文档 5.1 节：A3 短上下文为 TP4 DP4、40690 上下文、48 并发、16384 批次 token；长上下文为 TP8 DP1 PCP2、138000 上下文、16 并发、65536 批次 token。A2
  为 TP8、32 并发、32768 批次 token，按源文档保留省略 max-model-len。量化配置声明最大位置为 204800，未替换为上游基础配方的 196608。9.1 节表中 32k/200k 在此展开为
  32768/200000，短上下文可执行源命令仍为 40690。长 PD 测试假设 90% 前缀命中，短 PD 为 0%；这些是工作负载条件，不是实测结果。1p1d 源表列 EAGLE3=3，但可执行 Prefill 使用
  1，本配方以可执行命令为准。将 `--speculative_config` 规范为连字符写法，JSON 不变。276 GB 权重估算不含 EAGLE3、KV 和运行时。
faq: |-
  当前转换器 CLI 未注册本配方。其生成的 PD 模板假设 TP1 单设备索引，多 Decode 启动器使用节点本地 DP 地址，不适用于源场景 TP2/4/8 设备列表与共享 Decode DP 主节点。请使用上述完整内嵌脚本直接启动。结构校验通过不代表生成计划可执行，也不代表硬件验证通过。

  集群环境面板描述默认双节点 1p1d 拓扑，无法按场景展示不同的 Decode 节点数。可选 1p2d 请使用步骤中的三节点变量与编号命令，包括 DECODE_NODE_1_IP；该面板不能作为完整三节点配置。
