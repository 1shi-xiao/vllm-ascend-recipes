        --host 0.0.0.0 \
        --port $2 \
        --data-parallel-size $3 \
        --data-parallel-rank $4 \
        --data-parallel-address $5 \
        --data-parallel-rpc-port $6 \
        --tensor-parallel-size $7 \
        --enable-expert-parallel \
        --served-model-name minimax \
        --max-model-len 200000 \
        --max-num-batched-tokens 16384 \
        --max-num-seqs 16 \
        --trust-remote-code \
        --gpu-memory-utilization 0.75 \
        --quantization ascend \
        --async-scheduling \
        --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}' \
        --speculative-config '{"method":"eagle3","model":"/models/Eco-Tech/MiniMax-M2.7-eagle-model-short","num_speculative_tokens":3}' \
        --additional-config '{"enable_cpu_binding":true}' \
        --kv-transfer-config '{"kv_connector":"MooncakeConnectorV1","kv_role":"kv_consumer","kv_port":"56900","engine_id":"1","kv_connector_extra_config":{"use_ascend_direct":true,"prefill":{"dp_size":2,"tp_size":8},"decode":{"dp_size":4,"tp_size":8}}}'
      BASH
      ```
  - title: decode-1-launch
    content: |-
      在对应节点的独立终端启动此命令，并保持运行，再启动其余节点。

      ```bash
      cd /models
      python /workspace/recipe-helpers/examples/external_online_dp/launch_online_dp.py \
        --dp-size 4 --tp-size 8 --dp-size-local 2 --dp-rank-start 2 \
        --dp-address "$DECODE_NODE_0_IP" --dp-rpc-port 12321 --vllm-start-port 7100
      ```
  - title: backend-readiness
    content: |-
      从网关检查所有 rank 后再启动代理；此步骤只证明就绪。

      ```bash
      set -euo pipefail
      curl --fail --silent --show-error "http://${PREFILL_NODE_0_IP}:7000/v1/models"
      curl --fail --silent --show-error "http://${PREFILL_NODE_0_IP}:7001/v1/models"
      curl --fail --silent --show-error "http://${DECODE_NODE_0_IP}:7100/v1/models"
      curl --fail --silent --show-error "http://${DECODE_NODE_0_IP}:7101/v1/models"
      curl --fail --silent --show-error "http://${DECODE_NODE_1_IP}:7100/v1/models"
      curl --fail --silent --show-error "http://${DECODE_NODE_1_IP}:7101/v1/models"
      ```
  - title: gateway-0
    content: |-
      全部 rank 接口就绪后，在网关节点执行：

      ```bash
      python /workspace/recipe-helpers/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py \
        --host "$GATEWAY_NODE_0_IP" --port 8009 \
        --prefiller-hosts "$PREFILL_NODE_0_IP" "$PREFILL_NODE_0_IP" --prefiller-ports 7000 7001 \
        --decoder-hosts "$DECODE_NODE_0_IP" "$DECODE_NODE_0_IP" "$DECODE_NODE_1_IP" "$DECODE_NODE_1_IP" --decoder-ports 7100 7101 7100 7101
      ```
  - title: service-check
    content: |-
      ```bash
      set -euo pipefail
      curl --fail --silent --show-error http://${GATEWAY_NODE_0_IP}:8009/healthcheck
      response=$(curl --fail --silent --show-error http://${GATEWAY_NODE_0_IP}:8009/v1/completions \
        -H 'Content-Type: application/json' \
        -d '{"model":"minimax","max_tokens":64,"temperature":0,"prompt":"The future of AI is"}')
      python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["choices"]; assert r["choices"][0]["text"].strip()' <<<"$response"
      ```
