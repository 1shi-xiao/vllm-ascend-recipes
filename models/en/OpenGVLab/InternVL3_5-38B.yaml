  url: https://quay.io/repository/ascend/vllm-ascend?tab=tags
tuning: 'The executable baseline follows pinned main, not the inconsistent summary table: 40960 context tokens,
  TP4 = 4 logical devices and 32 sequences. The source summary table lists conflicting device counts and, for 38B,
  135000 context tokens. Those values are not used. The source request incorrectly targets port 8000; this recipe
  uses the actual serve port. Current main moved fused MC2 into additional-config and removed legacy FlashComm/async
  flags; those current commands are retained. Local-media access to `/` follows the source; restrict it for shared
  services. Weight-only VRAM estimates omit KV cache, runtime and mixed-precision vision overhead; measure actual
  allocation.'
