- test_id: minimax-long-1p1d
  npu: Atlas 800I A3
  precision: W8A8
  deployment: Multi-Node PD Separation
  case: long-1p1d
  npu_per_node: 16
  steps:
  - title: Topology and communication
    content: |-
      Two A3 nodes; the complete long-context 1p1d executable baseline in source section 5.2. Prefill uses EAGLE3=1 and eager execution, Decode EAGLE3=3 and graph mode.

      Set these values in every node terminal. Check HCCL/RDMA connectivity first. `IFACE_NAME` must be the fabric interface; Decode nodes share Decode node 0 as their DP master.

      ```bash
      export PREFILL_NODE_0_IP="<prefill-ip>"
      export DECODE_NODE_0_IP="<decode-master-ip>"
      export GATEWAY_NODE_0_IP="$PREFILL_NODE_0_IP"
      export IFACE_NAME="<fabric-interface>"
      ```
  - title: prefill-0-template
    content: |-
      On this role/node, save the following complete script as `/models/run_dp_template.sh`. Use separate nodes for different roles.

      ```bash
      cat > /models/run_dp_template.sh <<'BASH'
      #!/usr/bin/env bash
      set -euo pipefail
      unset http_proxy https_proxy ftp_proxy
      export HCCL_OP_EXPANSION_MODE=AIV
      export HCCL_BUFFSIZE=1024
      export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
      export OMP_NUM_THREADS=1
      export LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libjemalloc.so.2:${LD_PRELOAD:-}
      export TASK_QUEUE_ENABLE=1
      export HCCL_IF_IP=${PREFILL_NODE_0_IP}
      export GLOO_SOCKET_IFNAME=${IFACE_NAME}
      export TP_SOCKET_IFNAME=${IFACE_NAME}
      export HCCL_SOCKET_IFNAME=${IFACE_NAME}
      export LD_LIBRARY_PATH=/usr/local/Ascend/ascend-toolkit/latest/python/site-packages/mooncake:${LD_LIBRARY_PATH:-}
      export VLLM_ASCEND_ENABLE_FLASHCOMM1=1
      export VLLM_ASCEND_ENABLE_FUSED_MC2=1
      export PYTHONHASHSEED=0
      export ASCEND_RT_VISIBLE_DEVICES=$1
      cd /models
      exec vllm serve vllm-ascend/MiniMax-M2.7-w8a8-QuaRot \
        --host 0.0.0.0 \
        --port $2 \
        --data-parallel-size $3 \
        --data-parallel-rank $4 \
        --data-parallel-address $5 \
        --data-parallel-rpc-port $6 \
        --tensor-parallel-size $7 \
        --enable-expert-parallel \
        --served-model-name minimax \
        --max-model-len 200000 \
        --max-num-batched-tokens 16384 \
        --max-num-seqs 64 \
        --trust-remote-code \
        --gpu-memory-utilization 0.75 \
        --quantization ascend \
        --enforce-eager \
        --speculative-config '{"method":"eagle3","model":"/models/Eco-Tech/MiniMax-M2.7-eagle-model-short","num_speculative_tokens":1}' \
        --additional-config '{"enable_cpu_binding":true}' \
        --kv-transfer-config '{"kv_connector":"MooncakeConnectorV1","kv_role":"kv_producer","kv_port":"35880","engine_id":"0","kv_connector_extra_config":{"use_ascend_direct":true,"prefill":{"dp_size":2,"tp_size":8},"decode":{"dp_size":2,"tp_size":8}}}'
      BASH
      ```
  - title: prefill-0-launch
    content: |-
      Start this launcher on the corresponding node in its own terminal. Leave it running while starting the other nodes.

      ```bash
